name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK licenses & install SDK 36
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=$(command -v sdkmanager || find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT"
            exit 1
          fi
          echo "Using SDK_ROOT=$SDK_ROOT"
          echo "Using sdkmanager=$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web app
        env:
          VITE_APP_VERSION: 1.0.${{ github.run_number }}
          VITE_GITHUB_REPO: ${{ github.repository }}
        run: npm run build

      - name: Add Android platform
        run: |
          npx cap telemetry off || true
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "sdk.dir=$SDK_ROOT" > android/local.properties

      - name: Configure Android permissions & Google SocialLogin
        run: |
          node -e '
            const fs = require("fs");
            const manifestPath = "android/app/src/main/AndroidManifest.xml";
            let xml = fs.readFileSync(manifestPath, "utf8");
            for (const perm of ["android.permission.CAMERA", "android.permission.RECORD_AUDIO", "android.permission.POST_NOTIFICATIONS", "android.permission.USE_BIOMETRIC"]) {
              if (!xml.includes(perm)) {
                xml = xml.replace("</manifest>", `    <uses-permission android:name="${perm}" />\n</manifest>`);
              }
            }
            if (!xml.includes("android:windowSoftInputMode")) {
              xml = xml.replace("<activity", `<activity\n            android:windowSoftInputMode="adjustResize"`);
            }
            fs.writeFileSync(manifestPath, xml);

            const gradlePropsPath = "android/gradle.properties";
            let props = fs.existsSync(gradlePropsPath) ? fs.readFileSync(gradlePropsPath, "utf8") : "";
            for (const line of [
              "socialLogin.facebook.include=false",
              "socialLogin.apple.include=false",
              "socialLogin.twitter.include=false"
            ]) {
              if (!props.includes(line)) {
                props += `\n${line}\n`;
              }
            }
            fs.writeFileSync(gradlePropsPath, props);
          '
          mkdir -p android/app/src/main/res/values android/app/src/main/res/values-night android/app/src/main/res/drawable android/app/src/main/res/drawable-xxhdpi
          if [ -f "public/assets/aistudio/Applogo.png" ]; then
            cp "public/assets/aistudio/Applogo.png" android/app/src/main/res/drawable-xxhdpi/splash_logo.png
          fi
          cat <<'EOF' > android/app/src/main/res/values/colors.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="app_canvas_bg">#F8F7F5</color>
          </resources>
          EOF

          cat <<'EOF' > android/app/src/main/res/values-night/colors.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="app_canvas_bg">#171717</color>
          </resources>
          EOF

          cat <<'EOF' > android/app/src/main/res/drawable/splash.xml
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="@color/app_canvas_bg" />
              <item>
                  <bitmap
                      android:gravity="center"
                      android:src="@drawable/splash_logo" />
              </item>
          </layer-list>
          EOF
          rm -f android/app/src/main/res/drawable/splash.png android/app/src/main/res/drawable*/splash.png || true

          cat <<'EOF' > android/app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.DayNight.DarkActionBar">
                  <item name="colorPrimary">@color/app_canvas_bg</item>
                  <item name="colorPrimaryDark">@color/app_canvas_bg</item>
                  <item name="colorAccent">#D9A928</item>
              </style>

              <style name="AppTheme.NoActionBar" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="windowActionBar">false</item>
                  <item name="windowNoTitle">true</item>
                  <item name="android:windowBackground">@color/app_canvas_bg</item>
                  <item name="android:statusBarColor">@color/app_canvas_bg</item>
                  <item name="android:navigationBarColor">@color/app_canvas_bg</item>
                  <item name="android:windowLightStatusBar">true</item>
              </style>

              <style name="AppTheme.NoActionBarLaunch" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="android:windowBackground">@drawable/splash</item>
                  <item name="android:statusBarColor">@color/app_canvas_bg</item>
                  <item name="android:navigationBarColor">@color/app_canvas_bg</item>
                  <item name="android:windowLightStatusBar">true</item>
              </style>
          </resources>
          EOF

          cat <<'EOF' > android/app/src/main/res/values-night/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme.NoActionBar" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="windowActionBar">false</item>
                  <item name="windowNoTitle">true</item>
                  <item name="android:windowBackground">@color/app_canvas_bg</item>
                  <item name="android:statusBarColor">@color/app_canvas_bg</item>
                  <item name="android:navigationBarColor">@color/app_canvas_bg</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>

              <style name="AppTheme.NoActionBarLaunch" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="android:windowBackground">@drawable/splash</item>
                  <item name="android:statusBarColor">@color/app_canvas_bg</item>
                  <item name="android:navigationBarColor">@color/app_canvas_bg</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          mkdir -p android/app/src/main/java/com/riyad/notes
          cat <<'EOF' > android/app/src/main/java/com/riyad/notes/MainActivity.java
          package com.riyad.notes;

          import android.content.Intent;
          import android.os.Bundle;
          import android.util.Log;
          import com.getcapacitor.BridgeActivity;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginHandle;
          import ee.forgr.capacitor.social.login.GoogleProvider;
          import ee.forgr.capacitor.social.login.ModifiedMainActivityForSocialLoginPlugin;
          import ee.forgr.capacitor.social.login.SocialLoginPlugin;

          public class MainActivity extends BridgeActivity implements ModifiedMainActivityForSocialLoginPlugin {

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode >= GoogleProvider.REQUEST_AUTHORIZE_GOOGLE_MIN && requestCode < GoogleProvider.REQUEST_AUTHORIZE_GOOGLE_MAX) {
                      PluginHandle pluginHandle = getBridge().getPlugin("SocialLogin");
                      if (pluginHandle == null) {
                          Log.i("Google Activity Result", "SocialLogin handle is null");
                          return;
                      }
                      Plugin plugin = pluginHandle.getInstance();
                      if (!(plugin instanceof SocialLoginPlugin)) {
                          Log.i("Google Activity Result", "SocialLogin plugin instance is not SocialLoginPlugin");
                          return;
                      }
                      ((SocialLoginPlugin) plugin).handleGoogleLoginIntent(requestCode, data);
                  }
              }

              @Override
              public void IHaveModifiedTheMainActivityForTheUseWithSocialLoginPlugin() {}
          }
          EOF

      - name: Apply Android launcher icon
        run: |
          LOGO="public/assets/aistudio/Applogo.png"
          if [ -f "$LOGO" ]; then
            if ! command -v convert >/dev/null 2>&1 && ! command -v magick >/dev/null 2>&1; then
              sudo apt-get update -qq || true
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq imagemagick || true
            fi
            CMD=$(command -v magick || command -v convert || true)
            if [ -n "$CMD" ]; then
              RES="android/app/src/main/res"
              set_icon() {
                DIR="$RES/mipmap-$1"
                SIZE="$2"
                FG_SIZE="$3"
                FG_INNER="$4"
                mkdir -p "$DIR"
                $CMD "$LOGO" -resize "${SIZE}x${SIZE}" -background transparent -gravity center -extent "${SIZE}x${SIZE}" "$DIR/ic_launcher.png"
                cp "$DIR/ic_launcher.png" "$DIR/ic_launcher_round.png"
                $CMD "$LOGO" -resize "${FG_INNER}x${FG_INNER}" -background transparent -gravity center -extent "${FG_SIZE}x${FG_SIZE}" "$DIR/ic_launcher_foreground.png"
              }
              set_icon mdpi 48 108 72
              set_icon hdpi 72 162 108
              set_icon xhdpi 96 216 144
              set_icon xxhdpi 144 324 216
              set_icon xxxhdpi 192 432 288
              mkdir -p "$RES/drawable-xxhdpi"
              $CMD "$LOGO" -resize "240x240" -background transparent -gravity center -extent "240x240" "$RES/drawable-xxhdpi/splash_logo.png"
            fi
          fi

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Bump Android versionCode & versionName
        run: |
          node -e '
            const fs = require("fs");
            const p = "android/app/build.gradle";
            let gradle = fs.readFileSync(p, "utf8");
            const runNum = Number(process.env.GITHUB_RUN_NUMBER || "1");
            const versionCode = 10 + runNum;
            const versionName = `1.0.${runNum}`;
            gradle = gradle
              .replace(/versionCode\s+\d+/, `versionCode ${versionCode}`)
              .replace(/versionName\s+"[^"]+"/, `versionName "${versionName}"`);
            fs.writeFileSync(p, gradle);
            console.log(`Android build version updated -> versionCode=${versionCode}, versionName=${versionName}`);
          '

      - name: Build & Sign Release APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cd ..

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          ZIPALIGN=$(find "$SDK_ROOT/build-tools" \( -type f -o -type l \) -name zipalign | sort -V | tail -n 1)
          APKSIGNER=$(find "$SDK_ROOT/build-tools" \( -type f -o -type l \) -name apksigner | sort -V | tail -n 1)
          UNSIGNED_APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"

          if [ -z "$ZIPALIGN" ] || [ -z "$APKSIGNER" ]; then
            echo "zipalign or apksigner not found under $SDK_ROOT/build-tools"
            exit 1
          fi

          if [ ! -f "$UNSIGNED_APK" ]; then
            echo "Unsigned release APK not found at $UNSIGNED_APK"
            exit 1
          fi

          KEYSTORE_FILE="/tmp/notes-release.keystore"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "Using permanent keystore from GitHub Secrets."
            echo "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_FILE"
            ALIAS="${KEY_ALIAS:-notes_release}"
            SPASS="${KEYSTORE_PASS:-NotesRelease2026}"
            KPASS="${KEY_PASS:-$SPASS}"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret is not set. Using a temporary keystore; add permanent keystore secrets to support in-place APK updates and fixed SHA-1."
            ALIAS="notes_release"
            SPASS="NotesRelease2026"
            KPASS="NotesRelease2026"
            rm -f "$KEYSTORE_FILE"
            keytool -genkeypair -noprompt \
              -keystore "$KEYSTORE_FILE" \
              -alias "$ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$SPASS" \
              -keypass "$KPASS" \
              -dname "CN=Riyad Islam, OU=Mobile, O=Notes, L=Dhaka, S=Dhaka, C=BD"
          fi

          echo "=== Signing Certificate Fingerprints (for Firebase / Google Cloud Android OAuth) ==="
          keytool -list -v -keystore "$KEYSTORE_FILE" -alias "$ALIAS" -storepass "$SPASS" | grep -E "SHA1:|SHA256:" || true

          mkdir -p release-apk
          "$ZIPALIGN" -p -f 4 "$UNSIGNED_APK" /tmp/app-release-aligned.apk
          "$APKSIGNER" sign \
            --ks "$KEYSTORE_FILE" \
            --ks-key-alias "$ALIAS" \
            --ks-pass "pass:$SPASS" \
            --key-pass "pass:$KPASS" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out release-apk/Notes.apk \
            /tmp/app-release-aligned.apk

          "$APKSIGNER" verify --verbose --print-certs release-apk/Notes.apk
          rm -f "$KEYSTORE_FILE" /tmp/app-release-aligned.apk

      - name: Publish Notes.apk to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APP_VERSION="1.0.${{ github.run_number }}"
          TAG="v${APP_VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-apk/Notes.apk --clobber
          else
            gh release create "$TAG" release-apk/Notes.apk \
              --title "Notes ${TAG}" \
              --notes "Signed Android Release APK (Notes.apk) — Version ${APP_VERSION} (Build $((10 + ${{ github.run_number }})))" \
              --latest \
              --target "${{ github.sha }}"
          fi
